
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B141B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MECHTRACK MMJ2">

  <title>MECHTRACK MMJ2</title>

  <link rel="apple-touch-icon"
        href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png"
        href="./assets/icon-192.png">
  <link rel="manifest"
        href="./manifest.webmanifest">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, #172c3b 0%, #0b141b 65%);
      color: #f1f6fa;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 32px 26px;
      text-align: center;
    }

    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 25px;
      margin-bottom: 22px;
      filter: drop-shadow(0 8px 24px #0008);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 9px;
      color: #39baff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .loading {
      margin-top: 54px;
      color: #d5e2eb;
      font-size: 14px;
    }

    .loader {
      width: 28px;
      height: 28px;
      margin: 0 auto 17px;
      border: 3px solid #29404f;
      border-top-color: #39baff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .track {
      height: 4px;
      margin-top: 22px;
      background: #263744;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      width: 0;
      height: 100%;
      background: #39baff;
      animation: progress 3s linear forwards;
    }

    .status {
      margin-top: 17px;
      color: #8298a8;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      to { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation-duration: 2s; }
    }
  </style>
</head>

<body>
  <main class="container">
    <img class="logo"
         src="./assets/apple-touch-icon.png"
         alt="MECHTRACK MMJ2">

    <h1>MECHTRACK</h1>
    <div class="subtitle">MMJ2 · MAINTENANCE SYSTEM</div>

    <section class="loading">
      <div class="loader"></div>
      <div>Mempersiapkan aplikasi...</div>

      <div class="track">
        <div class="bar"></div>
      </div>

      <div class="status">SYSTEM INITIALIZATION</div>
    </section>
  </main>

  <script>
    const LOGIN_URL =
      "https://script.google.com/macros/s/AKfycbzGGPaMz8PSfK3bIOb0snPotbs0taebbySDJEHH1ZjwkOmhOsrDn42KfIbUJnx5Uy5n/exec";

    setTimeout(function () {
      window.location.replace(LOGIN_URL);
    }, 7000);
  </script>
</body>
</html>
